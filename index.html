<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aflow Studio</title>
<meta name="description" content="Mobile games and apps by Aflow Studio.">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #101014; color: #ecebf2;
         font: 17px/1.5 system-ui, -apple-system, sans-serif; padding: 48px 16px; }
  main { max-width: 460px; margin: 0 auto; }
  h1 { font-weight: 600; font-size: 30px; margin: 0 0 6px; text-align: center; }
  p.sous { color: #9a99a8; text-align: center; margin: 0 0 32px; }
  a.app { display: flex; align-items: center; gap: 16px; padding: 14px; margin: 0 0 12px;
          background: #1a1a21; border: 1px solid #2a2a33; border-radius: 18px; color: inherit; text-decoration: none; }
  a.app img { width: 64px; height: 64px; border-radius: 14px; flex: none; }
  a.app strong { display: block; font-size: 18px; }
  a.app span { color: #9a99a8; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Aflow Studio</h1>
  <p class="sous">Mobile games and apps</p>
  <a class="app" href="carat/"><img src="carat-icon.png" alt=""><div><strong>Carat: Gem Merge &amp; Hideout</strong><span>Merge jewels, crack the vault and build your thief's hideout.</span></div></a>
  <a class="app" href="monirate/"><img src="monirate-icon.png" alt=""><div><strong>MoniRate - Currencies &amp; Crypto</strong><span>Live exchange rates for currencies and crypto, in your pocket.</span></div></a>
</main>
</body>
</html>
