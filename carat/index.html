<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carat: Gem Merge &amp; Hideout</title>
<meta name="description" content="Merge jewels, crack the vault and build your thief's hideout.">
<meta property="og:title" content="Carat: Gem Merge &amp; Hideout">
<meta property="og:description" content="Merge jewels, crack the vault and build your thief's hideout.">
<meta property="og:image" content="https://aflow-studio.github.io/carat-icon.png">
<link rel="icon" href="../carat-icon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 30%, #2a1f15, #14100c 70%);
         color: #f5ecdc; font: 17px/1.5 system-ui, -apple-system, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
  main { max-width: 380px; width: 100%; }
  img { width: 132px; height: 132px; border-radius: 28px; box-shadow: 0 10px 40px rgba(0, 0, 0, .45); }
  h1 { font: normal 40px Georgia, "Times New Roman", serif; letter-spacing: .3em; color: #e8c478; margin: 22px 0 4px; }
  .accroche { font-size: 14px; letter-spacing: .12em; color: #b9a98f; margin: 0 0 8px; }
  .description { font-size: 15px; color: #b9a98f; margin: 0 0 26px; }
  a.btn { display: block; padding: 17px 20px; border-radius: 999px; text-decoration: none;
          font-weight: 600; font-size: 18px; margin: 0 0 12px; }
  .principal { background: #e8b046; color: #1e140a; }
  .second { border: 1px solid #5a4a35; color: #f5ecdc; }
  p.note { font-size: 13px; color: #b9a98f; margin-top: 22px; }
</style>
</head>
<body>
<main>
  <img src="../carat-icon.png" alt="CARAT">
  <h1>CARAT</h1>
  <p class="accroche">OPEN BETA · ANDROID · FREE</p>
  <p class="description">Merge jewels, crack the vault and build your thief's hideout.</p>
  <a class="btn principal" id="play" href="https://play.google.com/store/apps/details?id=com.aflowstudio.carat">Get it on Google Play</a>
  <a class="btn second" href="intent://details?id=com.aflowstudio.carat#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.aflowstudio.carat;end">Open the Play Store app</a>
  <p class="note">Nothing happens? Tap ⋮ at the top right, then “Open in browser”.</p>
</main>
<script>
  // Android : direction la fiche Google Play ; les boutons restent en secours.
  if (/Android/i.test(navigator.userAgent)) {
    setTimeout(function () { location.href = document.getElementById("play").href; }, 600);
  }
</script>
</body>
</html>
