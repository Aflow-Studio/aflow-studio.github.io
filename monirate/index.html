<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoniRate - Currencies &amp; Crypto</title>
<meta name="description" content="Live exchange rates for currencies and crypto, in your pocket.">
<meta property="og:title" content="MoniRate - Currencies &amp; Crypto">
<meta property="og:description" content="Live exchange rates for currencies and crypto, in your pocket.">
<meta property="og:image" content="https://aflow-studio.github.io/monirate-icon.png">
<link rel="icon" href="../monirate-icon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 30%, #0c2a4d, #0f1117 70%);
         color: #e8eef6; font: 17px/1.5 system-ui, -apple-system, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
  main { max-width: 380px; width: 100%; }
  img { width: 132px; height: 132px; border-radius: 28px; box-shadow: 0 10px 40px rgba(0, 0, 0, .45); }
  h1 { font: normal 40px system-ui, -apple-system, sans-serif; letter-spacing: .02em; color: #ffffff; margin: 22px 0 4px; }
  .accroche { font-size: 14px; letter-spacing: .12em; color: #93a4b8; margin: 0 0 8px; }
  .description { font-size: 15px; color: #93a4b8; margin: 0 0 26px; }
  a.btn { display: block; padding: 17px 20px; border-radius: 999px; text-decoration: none;
          font-weight: 600; font-size: 18px; margin: 0 0 12px; }
  .principal { background: #378add; color: #ffffff; }
  .second { border: 1px solid #2a3a52; color: #e8eef6; }
  p.note { font-size: 13px; color: #93a4b8; margin-top: 22px; }
</style>
</head>
<body>
<main>
  <img src="../monirate-icon.png" alt="MoniRate">
  <h1>MoniRate</h1>
  <p class="accroche">ANDROID · FREE</p>
  <p class="description">Live exchange rates for currencies and crypto, in your pocket.</p>
  <a class="btn principal" id="play" href="https://play.google.com/store/apps/details?id=com.monirate.app">Get it on Google Play</a>
  <a class="btn second" href="intent://details?id=com.monirate.app#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.monirate.app;end">Open the Play Store app</a>
  <p class="note">Nothing happens? Tap ⋮ at the top right, then “Open in browser”.</p>
</main>
<script>
  // Android : direction la fiche Google Play ; les boutons restent en secours.
  if (/Android/i.test(navigator.userAgent)) {
    setTimeout(function () { location.href = document.getElementById("play").href; }, 600);
  }
</script>
</body>
</html>
